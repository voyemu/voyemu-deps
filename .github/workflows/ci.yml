# Source-only native checks. OEM inputs and guest machines are not built here.
name: ci

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
    # The release workflow runs the same checks before it builds the archives.
    workflow_call:
        inputs:
            macos_only:
                type: boolean
                default: false
            windows_only:
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    source-fixtures:
        name: Source fixtures (${{ matrix.host }})
        strategy:
            fail-fast: false
            matrix:
                host: ${{ fromJSON(inputs.macos_only && '["macos-arm64"]' || inputs.windows_only && '["linux-x64","windows-x64"]' || '["linux-x64","macos-arm64","windows-x64"]') }}
        runs-on: ${{ matrix.host == 'macos-arm64' && 'macos-15' || matrix.host == 'windows-x64' && 'windows-2022' || 'ubuntu-24.04' }}
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        env:
            JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1 -Xmx512m
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/toolchains
              with:
                  set: ${{ matrix.host == 'macos-arm64' && 'macos' || matrix.host == 'windows-x64' && 'windows' || 'linux' }}
                  fixture-inputs: 'true'
            - if: runner.os == 'macOS'
              run: sudo xcode-select --switch /Library/Developer/CommandLineTools
            - run: cmake -S src/app -B .local/build/source-fixtures -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/zig-${{ matrix.host }}.cmake" -DBUILD_TESTING=ON -DVOYEMU_BUILD_GRAPHICS=OFF
            - run: cmake --build .local/build/source-fixtures --target native_component_test --parallel 1
            # Suites labeled source-fixture need only public pinned tools; OEM inputs stay explicitly excluded.
            - run: ctest --test-dir .local/build/source-fixtures --label-regex '^source-fixture$' --label-exclude '^oem$' --no-tests=error --output-on-failure --parallel 1 --output-junit source-fixtures.xml
            - run: cmake -DRESULT="$PWD/.local/build/source-fixtures/source-fixtures.xml" -P src/dev/ci/source-fixtures-result.cmake

    lint:
        name: Lint (Linux x64, Zig)
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/toolchains
              with:
                  set: lint
            - run: cmake -S src/app -B .local/build/lint -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/zig-linux-x64.cmake" -DBUILD_TESTING=ON
            # lint builds every checked target first, so generated headers exist; -k 0 reports every failing check.
            - run: cmake --build .local/build/lint --target lint --parallel 4 -- -k 0

    linux:
        if: ${{ !inputs.macos_only }}
        name: Linux x64 Release (Zig)
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/toolchains
              with:
                  set: linux
            - run: cmake -S src/app -B .local/build/linux -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/zig-linux-x64.cmake" -DBUILD_TESTING=ON
            - run: cmake --build .local/build/linux --parallel 4
            - run: ./.local/build/linux/voyemu --help
            # The size of the launcher and of its sections, to compare size changes between commits.
            - run: ls -l .local/build/linux/voyemu && size -A .local/build/linux/voyemu
            # Tests labeled deps need toolchains installed by deps and tests labeled oem need imported OEM inputs.
            - name: Install pinned KornShell for startup fence tests
              run: |
                  pins=src/app/toolchain.json
                  prefix="$PWD/$(jq -er .optionalTools.linuxBuild.ksh.directory "$pins")"
                  mkdir -p "$prefix"
                  curl --fail --location --retry 3 "$(jq -er .optionalTools.linuxBuild.ksh.url "$pins")" --output "$prefix/ksh.deb"
                  echo "$(jq -er .optionalTools.linuxBuild.ksh.sha256 "$pins")  $prefix/ksh.deb" | sha256sum --check
                  dpkg-deb --extract "$prefix/ksh.deb" "$prefix"
                  echo "VOYEMU_TEST_KSH=$prefix/bin/ksh93" >> "$GITHUB_ENV"
            - run: ctest --test-dir .local/build/linux --label-exclude 'oem|deps' --output-on-failure --parallel 2

    tidy-check-windows:
        if: ${{ !inputs.macos_only }}
        name: clang-tidy check (Windows x64 MinGW, Zig cross-build)
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/toolchains
              with:
                  set: tidy-windows
            - run: cmake -S src/app -B .local/build/tidy-windows -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/zig-windows-x64.cmake" -DBUILD_TESTING=ON
            # The target first builds every checked target, so generated headers exist.
            - run: cmake --build .local/build/tidy-windows --target tidy-check --parallel 4

    macos-native:
        if: ${{ !inputs.windows_only }}
        name: macOS arm64 Release (Zig native, Command Line Tools SDK)
        runs-on: macos-15
        timeout-minutes: 30
        env:
            TMPDIR: ${{ github.workspace }}/.local/build/tmp/ci
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: mkdir -p .local/build/tmp/ci
            - uses: ./.github/actions/toolchains
              with:
                  set: macos
            - run: sudo xcode-select --switch /Library/Developer/CommandLineTools && xcrun --sdk macosx --show-sdk-path
            # Graphics is on as in the release build; real ANGLE tests are labeled deps and need the pinned SDK.
            - run: cmake -S src/app -B .local/build/native-host -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/zig-macos-arm64.cmake" -DBUILD_TESTING=ON
            - run: cmake --build .local/build/native-host --parallel 3
            - run: ./.local/build/native-host/voyemu --help
            - run: codesign --verify --strict ./.local/build/native-host/voyemu
            - run: ls -l .local/build/native-host/voyemu && size -m .local/build/native-host/voyemu
            - run: ctest --test-dir .local/build/native-host --label-exclude 'oem|deps' --output-on-failure --parallel 1

    windows-cross:
        if: ${{ !inputs.macos_only }}
        name: Windows x64 MinGW Release (Zig cross-build, Wine)
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            WINEPREFIX: ${{ github.workspace }}/.local/build/wine-ci/prefix
            WINEARCH: win64
            WINEDEBUG: -all
            WINEDLLOVERRIDES: mscoree,mshtml=
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/toolchains
              with:
                  set: windows-cross
            - run: cmake -S src/app -B .local/build/windows-cross -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/zig-windows-x64.cmake" -DBUILD_TESTING=ON
            - run: cmake --build .local/build/windows-cross --parallel 4
            # Cross-built binaries run through Wine below; no PDB may be produced.
            - run: test -f .local/build/windows-cross/voyemu.exe && test -z "$(find .local/build/windows-cross -name '*.pdb' -print -quit)"
            - run: ls -l .local/build/windows-cross/voyemu.exe && objdump -h .local/build/windows-cross/voyemu.exe
            - run: bash src/dev/ci/wine-install.sh
            - run: |
                  mkdir -p "$WINEPREFIX"
                  xvfb-run -a wineboot -u
            - run: xvfb-run -a cmake -DBUILD="$PWD/.local/build/windows-cross" -DWINE="$(command -v wine)" -P src/dev/ci/wine-tests.cmake
            - if: always()
              run: |
                  if [[ -d "$WINEPREFIX" ]]; then
                      kill_status=0
                      kill_output=$(wineserver -k 2>&1) || kill_status=$?
                      if [[ -n "$kill_output" ]]; then
                          printf '%s\n' "$kill_output" >&2
                      fi
                      timeout 20s wineserver -w
                      # Wine returns 1 without a diagnostic when the server already exited.
                      if [[ "$kill_status" != 1 || -n "$kill_output" ]]; then
                          exit "$kill_status"
                      fi
                  fi

    windows-native:
        if: ${{ !inputs.macos_only }}
        name: Windows x64 MinGW Release (Zig native)
        runs-on: windows-2022
        timeout-minutes: 60
        defaults:
            run:
                shell: pwsh
        env:
            TEMP: ${{ github.workspace }}\.local\build\tmp\ci
            TMP: ${{ github.workspace }}\.local\build\tmp\ci
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: New-Item -ItemType Directory -Force .local/build/tmp/ci | Out-Null
            - name: Prepare private fixture location
              run: |
                  $fixtures = Join-Path $env:USERPROFILE 'voyemu-native-test'
                  New-Item -ItemType Directory -Force $fixtures | Out-Null
                  "VOYEMU_NATIVE_FIXTURE_BASE=$fixtures" >> $env:GITHUB_ENV
            - uses: ./.github/actions/toolchains
              with:
                  set: windows
            - run: cmake -S src/app -B .local/build/windows-native -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/zig-windows-x64.cmake" -DBUILD_TESTING=ON
            - run: cmake --build .local/build/windows-native --parallel 4
            - run: .\.local\build\windows-native\voyemu.exe --help
            - run: (Get-Item .local/build/windows-native/voyemu.exe).Length
            # Host-only checks exclude dependency and OEM suites; missing inputs remain failures in strict suites.
            - name: Run native Windows host tests
              id: host-tests
              run: ctest --test-dir .local/build/windows-native --label-exclude 'oem|deps' --output-on-failure --parallel 1
            # Failed CLI fixtures retain supervisor logs and state; passing fixtures remove their roots.
            - name: Upload retained native fixture diagnostics
              if: failure() && steps.host-tests.outcome == 'failure'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: windows-native-fixture-diagnostics
                  path: |
                      ${{ env.VOYEMU_NATIVE_FIXTURE_BASE }}
                      !${{ env.VOYEMU_NATIVE_FIXTURE_BASE }}/**/*.exe
                  # Supervisor logs and session state live under each fixture's .local directory.
                  include-hidden-files: true
                  if-no-files-found: ignore
